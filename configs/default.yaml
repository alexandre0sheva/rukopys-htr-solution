source_dataset: UkrainianCatholicUniversity/rukopys
curated_dataset: AlexandreSheva/rukopys-curated-mvp
models:
  detector: yolo11n.pt
  vlm_base: Qwen/Qwen3-VL-8B-Instruct
  vlm_fallback: Qwen/Qwen3-VL-2B-Instruct
curation:
  include_silver: true
  max_silver: null
  crop_images: true
  page_sft: true
  val_fraction: 0.15
  seed: 42
quality_weights:
  annotator: 1.0
  volunteer: 0.75
  auto: 0.35
region_types:
  - handwritten
  - printed
  - formula
  - table
  - annotation
  - image
  - graph
inference:
  detector_confidence: 0.25
  detector_iou: 0.5
  mode: detector-vlm
  region_max_new_tokens: 192
  page_max_new_tokens: 2048
  max_pixels: 262144
training:
  eval_fraction: 0.1
  eval_steps: 50
  max_pixels: 401408
